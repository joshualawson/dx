name: Images

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'images/**'
      - 'cmd/dx-idle/**'
      - 'go.mod'
      - 'go.sum'
      - '.dockerignore'
      - '.github/workflows/images.yml'
  pull_request:
    paths:
      - 'images/**'
      - 'cmd/dx-idle/**'
      - 'go.mod'
      - 'go.sum'
      - '.dockerignore'
      - '.github/workflows/images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/base/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: |
            type=oci,dest=${{ runner.temp }}/base.tar
            ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'type=registry' || '' }}
          tags: |
            ghcr.io/joshualawson/dx-base:latest
            ghcr.io/joshualawson/dx-base:bookworm
            ghcr.io/joshualawson/dx-base:${{ github.sha }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base
      - uses: actions/upload-artifact@v4
        with:
          name: base-oci
          path: ${{ runner.temp }}/base.tar
          compression-level: 0
          retention-days: 1

  toolchains:
    needs: base
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: go
            version: '1.25'
          - image: node
            version: '22'
          - image: python
            version: '3.13'
          - image: rust
            version: stable
          - image: infra
            version: '1.13.2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: base-oci
          path: ${{ runner.temp }}
      - name: Extract this run's base image
        env:
          BASE_DIR: ${{ runner.temp }}/base
          BASE_TAR: ${{ runner.temp }}/base.tar
        run: |
          mkdir -p "$BASE_DIR"
          tar -xf "$BASE_TAR" -C "$BASE_DIR"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: BASE=base
          build-contexts: base=oci-layout://${{ runner.temp }}/base
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: |
            ghcr.io/joshualawson/dx-${{ matrix.image }}:latest
            ghcr.io/joshualawson/dx-${{ matrix.image }}:${{ matrix.version }}
            ghcr.io/joshualawson/dx-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
